# ── SYS-PROD-001 · 生产 nginx 容器的工作台站点 ──────────────────────────────────────
# 落盘位置：code/deploy/prod/nginx/workspace.conf → compose 挂进容器 /etc/nginx/conf.d/default.conf
#
# ★ 模板变量只有一个：`__LQG_DOMAIN__`。deploy.sh 的 `render-nginx` 用 sed 把它替换成
#   .env 里的 LQG_PROD_DOMAIN 后再 rsync 上机（**不用 envsubst**：nginx 配置里满是
#   `$host` / `$scheme` / `$uri`，envsubst 会把它们一起吃掉，白名单要写很长且容易漏）。
#
# 与测试环境的分层差别（别互相抄）：
#   测试机：宿主宝塔 nginx 终止 TLS → 容器只监听 80、只发布到 127.0.0.1
#   生产机：这台机器上只有我们 → **容器直接监听 80 / 443 并终止 TLS**（compose 映射 80,443）
#   所以本文件里有两个 server 块（80 跳转 + 443 TLS），测试环境那份只有一个 80 的块。
#
# 证书：宿主的 acme.sh 把 fullchain / privkey 写到 ${LQG_DATA_DIR}/certs/<域名>/，
#   compose 把整个 certs 目录只读挂进 /etc/nginx/certs → 这里按域名路径引用。
#   ★ 续期后必须 reload（acme.sh 的 --reloadcmd，见 deploy.sh 的 print-cert-cron）：nginx 只在
#     启动 / reload 时读证书文件，不 reload 的话新证书要等到下次重启才生效。
#   ★ 首次签发前这个目录是空的，`nginx -t` 会因为证书文件不存在而失败 —— 首次部署顺序是
#     「先起 nginx（用自签占位证书或 80-only 模式）→ 签证书 → render+reload」，见部署手册 §4。

# ── HTTP：ACME 挑战 + 全域 301 到 HTTPS ────────────────────────────────────────────
server {
    listen       80;
    listen       [::]:80;
    server_name  __LQG_DOMAIN__;

    # ★ 必须保留：acme.sh 走 webroot 续期，/.well-known/acme-challenge/<token> 由它写、
    #   由 nginx 读。这条 `^~` 前缀比下面的 `location /` 长，优先命中 —— 少了它续期必失败。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    # accept 1 最后一段查的就是这个：http://<域名>/ 必须 301 到 https://
    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}

# ── HTTPS：TLS 终止 + 工作台静态产物 + 接口反代 ──────────────────────────────────────
server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  __LQG_DOMAIN__;

    # 只上 TLSv1.2 / 1.3：小程序与工作台都支持；旧协议没有留的理由。
    ssl_certificate     /etc/nginx/certs/__LQG_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/__LQG_DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    # OCSP stapling：省一次客户端往返；解析失败不影响握手。
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            223.5.5.5 119.29.29.29 valid=300s ipv6=off;
    resolver_timeout    5s;

    root  /usr/share/nginx/html;
    index index.html;

    # 上传体积上限 60MB（票面 §2 硬要求；后端 spring.servlet.multipart 与小程序上传同一口径）。
    # 超限时 nginx 直接回 413，不会打到后端。
    client_max_body_size 60m;
    client_body_timeout  300s;

    # 安全响应头统一在 security-headers.inc 里（含 HSTS）；放在 server 层，
    # 各个 location 里不再重复 add_header（nginx 的 add_header 不继承，重复写只会互相覆盖）。
    include /etc/nginx/conf.d/lqg-security-headers.inc;

    # ── 1) 网页工作台的 API：plus-ui 的 VITE_APP_BASE_API=/prod-api ─────────────────
    #    带 `^~` 前缀，避免被下面的正则 location 抢走。proxy_pass 末尾的 `/` 会**剥掉** /prod-api。
    location ^~ /prod-api/ {
        proxy_pass http://backend:8080/;
        include /etc/nginx/conf.d/lqg-proxy-headers.inc;
    }

    # ── 2) 小程序 / doc/verify/api.sh 直连的根路径接口（**不剥前缀**）──────────────
    #    小程序 env/.env.production 的 VITE_SERVER_BASEURL=https://<域名>，请求 /auth/login、/mp/...；
    #    api.sh 请求 /auth/login、/lqg/sys/ping —— 都不带 /prod-api。
    location ~ ^/(auth|lqg|mp|system|monitor|resource|tool|workflow|actuator)/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/lqg-proxy-headers.inc;
    }

    # ── 3) 工作台静态资源 + SPA history 回退 ────────────────────────────────────────
    #    缺 try_files 这条，深链直接 404（首页 200 会骗人，栈坑手册 §7）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（plus-ui 的产物带 hash，长缓存安全）
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # acme 的 webroot 在生产不对外服务（HTTPS 上的挑战走 80），显式挡掉免得被当静态目录扫
    location ^~ /.well-known/acme-challenge/ {
        return 404;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
