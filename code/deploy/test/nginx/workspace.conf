# ── SYS-STAGING-001 · 测试环境 compose 里的 nginx ─────────────────────────────
# 测试机上路径：/opt/lqg-test/nginx/workspace.conf → 挂进容器 /etc/nginx/conf.d/default.conf
# 模板与分层说明见 code/deploy/common/nginx/workspace-site.conf.template
# ★ HTTPS 不在这一层：宿主 80/443 归宝塔（别人的站点也在这台机器上），容器只监听 80、
#   只发布到宿主 127.0.0.1:${LQG_WEB_PORT}；TLS 由宿主 nginx 终止（宿主 vhost 由 host-nginx.sh 落）。
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 上传体积上限 60m：与后端 spring.servlet.multipart.max-request-size（60MB）、生产 nginx 同口径（V05）
    client_max_body_size 60m;

    # 上传体积超限（V05）：回与后端同口径的 JSON（{code,msg}），不回 nginx 默认的 413 HTML ——
    # 工作台 / 小程序按响应体的 code、msg 给提示。数值与后端 spring.servlet.multipart 同口径。
    error_page 413 = @lqg_413;
    location @lqg_413 {
        default_type "application/json; charset=utf-8";
        return 413 '{"code":413,"msg":"上传的文件太大：单个文件不能超过 50MB，一次上传合计不能超过 60MB","data":null}';
    }

    # ── 0) actuator 一律不对外（V18）：根路径与 /prod-api 前缀两条路都挡，统一 404 ─────────
    #    上游 SecurityConfig 用 Basic 认证护 /actuator，而本项目从没配过那对口令 —— 期望值是字面量
    #    「null:null」，dev / test 下全量暴露（env、heapdump 都在）。这里在入口直接挡掉；
    #    `^~` 前缀比下面的 `^~ /prod-api/` 长、又压过正则，/prod-api/actuator/… 也进不去。
    location ^~ /actuator {
        return 404;
    }
    location ^~ /prod-api/actuator {
        return 404;
    }

    # 1) 网页工作台的 API：plus-ui 的 VITE_APP_BASE_API=/prod-api（剥前缀）
    location ^~ /prod-api/ {
        proxy_pass http://backend:8080/;
        include /etc/nginx/conf.d/lqg-proxy-headers.inc;
    }

    # 2) 小程序 / doc/verify/api.sh 直连的根路径接口（原样透传）
    location ~ ^/(auth|lqg|mp|system|monitor|resource|tool|workflow|snail-job)/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/lqg-proxy-headers.inc;
    }

    # 3) 工作台静态资源 + SPA history 回退（深链不许 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
