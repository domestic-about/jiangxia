# ── SYS-STAGING-001 · 测试环境 compose 里的 nginx ─────────────────────────────
# 测试机上路径：/opt/lqg-test/nginx/workspace.conf → 挂进容器 /etc/nginx/conf.d/default.conf
# 模板与分层说明见 code/deploy/common/nginx/workspace-site.conf.template
# ★ HTTPS 不在这一层：宿主 80/443 归宝塔（别人的站点也在这台机器上），容器只监听 80、
#   只发布到宿主 127.0.0.1:${LQG_WEB_PORT}；TLS 由宿主 nginx 终止（宿主 vhost 由 host-nginx.sh 落）。
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # 1) 网页工作台的 API：plus-ui 的 VITE_APP_BASE_API=/prod-api（剥前缀）
    location ^~ /prod-api/ {
        proxy_pass http://backend:8080/;
        include /etc/nginx/conf.d/lqg-proxy-headers.inc;
    }

    # 2) 小程序 / doc/verify/api.sh 直连的根路径接口（原样透传）
    location ~ ^/(auth|lqg|mp|system|monitor|resource|tool|workflow|actuator|snail-job)/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/lqg-proxy-headers.inc;
    }

    # 3) 工作台静态资源 + SPA history 回退（深链不许 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
