---
# ── SYS-BASE-001 起：本项目的开发环境覆盖（上游 5.5.3 的 dev 是 MySQL，本项目按 ADR-0002 换 PostgreSQL）──
# 监控中心配置：本地开发不连 Spring Boot Admin（本票不起监控服务；要起是后续 ticket 的事）
spring.boot.admin.client:
  # 增加客户端开关
  enabled: false

--- # 本机 dev 的口令与端口：自动读 code/deploy/dev/.env（gitignored，和 dev compose 同一份）
# 这样 `mvn spring-boot:run -pl ruoyi-admin` 或 IDE 直接起 dev，不用先 export LQG_*。
# 三个候选对应三种工作目录：ruoyi-admin（spring-boot:run / IDE）、RuoYi-Vue-Plus、工作区根（local.sh / qa-up.sh）。
# optional：找不到就跳过，退回下面各处的缺省值；命令行与真实环境变量的优先级仍高于它（隔离环境靠环境变量覆盖）。
spring.config.import:
  - optional:file:../../deploy/dev/.env[.properties]
  - optional:file:../deploy/dev/.env[.properties]
  - optional:file:code/deploy/dev/.env[.properties]

--- # api 接口加解密（dev 关掉，与 test 同一口径）
# 小程序与工作台的 dev 构建都不加密请求（plus-ui/.env.development 的 VITE_APP_ENCRYPT=false），
# doc/verify/api.sh 也是裸 curl。原先靠启动参数 --api-decrypt.enabled=false 关，IDE 里直接用 dev profile 启动时
# 没带这个参数，CryptoFilter 把不带加密头的登录请求一律拒成 403「没有访问权限」（2026-09-24 Kevin 本机实测）。
# 写进 dev 文件，怎么启动都一样；prod 仍然刻意不出现这个键。
api-decrypt:
  enabled: false

--- # snail-job 配置
# 本项目不用 SnailJob（ADR-0001：定时任务用 Spring @Scheduled）。上游默认 true，这里关掉，
# 免得它去连 17888 的调度服务、报连接错。
# ★ 其余键（port / group / token / server / namespace）必须留着：ruoyi-job 里的 TestBroadcastJob
#   用 @Value("${snail-job.port}") 取值，删了整段会让容器起不来（PlaceholderResolutionException）。
snail-job:
  enabled: false
  # 需要在 SnailJob 后台组管理创建对应名称的组,然后创建任务的时候选择对应的组,才能正确分派任务
  group: "ruoyi_group"
  # SnailJob 接入验证令牌 详见 script/sql/ry_job.sql `sj_group_config` 表
  token: "SJ_cKqBTPzCsWA3VyuCfFoccmuIEGXjr5KT"
  server:
    host: 127.0.0.1
    port: 17888
  # 命名空间UUID 详见 script/sql/ry_job.sql `sj_namespace`表`unique_id`字段
  namespace: ${spring.profiles.active}
  # 随主应用端口漂移
  port: 2${server.port}
  # 客户端ip指定
  host:

--- # 数据源配置（PostgreSQL 16，ADR-0002）
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # 动态数据源文档 https://www.kancloud.cn/tracy5546/dynamic-datasource/content
    dynamic:
      # 性能分析插件(有性能损耗 不建议生产环境使用)
      p6spy: true
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      # 严格模式 匹配不到数据源则报错
      strict: true
      datasource:
        # 主库数据源：库 lqg_dev，宿主端口 5433（5432 留给 Kevin 本机日常服务）
        master:
          type: ${spring.datasource.type}
          driverClassName: org.postgresql.Driver
          url: jdbc:postgresql://${LQG_DB_HOST:127.0.0.1}:${LQG_DB_PORT:5433}/${LQG_DB_NAME:lqg_dev}?reWriteBatchedInserts=true&stringtype=unspecified
          username: ${LQG_DB_USER:lqg}
          password: ${LQG_DB_PASSWORD:lqg_dev_pwd}
#        # 从库数据源
#        slave:
#          lazy: true
#          type: ${spring.datasource.type}
#          driverClassName: com.mysql.cj.jdbc.Driver
#          url: jdbc:mysql://localhost:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
#          username:
#          password:
#        oracle:
#          type: ${spring.datasource.type}
#          driverClassName: oracle.jdbc.OracleDriver
#          url: jdbc:oracle:thin:@//localhost:1521/XE
#          username: ROOT
#          password: root
#        postgres:
#          type: ${spring.datasource.type}
#          driverClassName: org.postgresql.Driver
#          url: jdbc:postgresql://localhost:5432/postgres?useUnicode=true&characterEncoding=utf8&useSSL=true&autoReconnect=true&reWriteBatchedInserts=true
#          username: root
#          password: root
#        sqlserver:
#          type: ${spring.datasource.type}
#          driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
#          url: jdbc:sqlserver://localhost:1433;DatabaseName=tempdb;SelectMethod=cursor;encrypt=false;rewriteBatchedStatements=true
#          username: SA
#          password: root
      hikari:
        # 最大连接池数量
        maxPoolSize: 20
        # 最小空闲线程数量
        minIdle: 10
        # 配置获取连接等待超时的时间
        connectionTimeout: 30000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 600000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: 1800000
        # 多久检查一次连接的活性
        keepaliveTime: 30000

--- # redis 单机配置(单机与集群只能开启一个另一个需要注释掉)
spring.data:
  redis:
    # 地址
    host: ${LQG_REDIS_HOST:127.0.0.1}
    # 端口：6379 留给 Kevin 本机日常服务，开发环境用 6380
    port: ${LQG_REDIS_PORT:6380}
    # 数据库索引
    database: 0
    # redis 密码：本机开发不设密码（compose 里也没设）
    password: ${LQG_REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 10s
    # 是否开启ssl
    ssl.enabled: false

# redisson 配置
redisson:
  # redis key前缀
  keyPrefix:
  # 线程池数量
  threads: 4
  # Netty线程池数量
  nettyThreads: 8
  # 单节点配置
  singleServerConfig:
    # 客户端名称 不能用中文
    clientName: RuoYi-Vue-Plus
    # 最小空闲连接数
    connectionMinimumIdleSize: 8
    # 连接池大小
    connectionPoolSize: 32
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 3000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50

--- # mail 邮件发送
mail:
  enabled: false
  host: smtp.163.com
  port: 465
  # 是否需要用户名密码验证
  auth: true
  # 发送方，遵循RFC-822标准
  from: xxx@163.com
  # 用户名（注意：如果使用foxmail邮箱，此处user为qq号）
  user: xxx@163.com
  # 密码（注意，某些邮箱需要为SMTP服务单独设置密码，详情查看相关帮助）
  pass: xxxxxxxxxx
  # 使用 STARTTLS安全连接，STARTTLS是对纯文本通信协议的扩展。
  starttlsEnable: true
  # 使用SSL安全连接
  sslEnable: true
  # SMTP超时时长，单位毫秒，缺省值不超时
  timeout: 0
  # Socket连接超时值，单位毫秒，缺省值不超时
  connectionTimeout: 0

--- # sms 短信 支持 阿里云 腾讯云 云片 等等各式各样的短信服务商
# https://sms4j.com/doc3/ 差异配置文档地址 支持单厂商多配置，可以配置多个同时使用
sms:
  # 配置源类型用于标定配置来源(interface,yaml)
  config-type: yaml
  # 用于标定yml中的配置是否开启短信拦截，接口配置不受此限制
  restricted: true
  # 短信拦截限制单手机号每分钟最大发送，只对开启了拦截的配置有效
  minute-max: 1
  # 短信拦截限制单手机号每日最大发送量，只对开启了拦截的配置有效
  account-max: 30
  # 以下配置来自于 org.dromara.sms4j.provider.config.BaseConfig类中
  blends:
    # 唯一ID 用于发送短信寻找具体配置 随便定义别用中文即可
    # 可以同时存在两个相同厂商 例如: ali1 ali2 两个不同的阿里短信账号 也可用于区分租户
    config1:
      # 框架定义的厂商名称标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: alibaba
      # 有些称为accessKey有些称之为apiKey，也有称为sdkKey或者appId。
      access-key-id: 您的accessKey
      # 称为accessSecret有些称之为apiSecret
      access-key-secret: 您的accessKeySecret
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId
    config2:
      # 厂商标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: tencent
      access-key-id: 您的accessKey
      access-key-secret: 您的accessKeySecret
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId


