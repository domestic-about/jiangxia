--- # 登录验证码
# 开发环境关掉：doc/verify/api.sh 的账号密码登录不带 code / uuid（栈坑手册 §12.6 说的是生产该开着，
# 生产覆盖层没关它，只在本文件关）。
captcha:
  enable: false

--- # 数据加密（@EncryptField）
# dev / test **写死**这四项：doc/verify/seed/ 里的密文是按 AES/ECB/PKCS5Padding + 口令 LqgTestAesKey#01
# 预先算出来的，口令对不上就读出乱码。生产（application-prod.yml）只从环境变量取口令，不进仓库。
mybatis-encryptor:
  enable: true
  algorithm: AES
  encode: BASE64
  password: LqgTestAesKey#01

--- # 本项目（ruoyi-lqg）自有配置
lqg:
  auth:
    # 小程序 mock 登录（ADR-0008）：xcxCode="mock:<key>" 时跳过微信换 openid，手机号直接取
    # phoneCode="mock:<手机号>"。**只允许 dev / test**：application-prod.yml 里刻意不出现这个键
    # （缺省 false），prod 下若被打开，MockLoginGuard 会让应用拒绝启动。
    mock-login: true
  # 拍照识别（OCR-IMPL-001 / ADR-0007）：一个方案一个 OcrProvider 实现类，配置切换。
  #   provider=none（缺省）→ 直接提示「识别暂不可用，请手动填写」，小程序照常能手填；
  #   provider=stub        → **仅 dev / test** 的测试桩：按请求头 X-Ocr-Stub-Case 的前两位
  #                          从 classpath 的 ocr-cases.json 取 rawLines（ruoyi-lqg 的 src/main/resources/，
  #                          与 doc/verify/fixtures/ 那份逐字节一致）；**没带这个头时回 01 号样例**
  #                          （小程序不发这个头，本机 / 试用环境靠它演示「拍照 → 预填 → 请核对」）。
  #                          真实识别服务等 OCR-SPIKE-001 的探路结论，本票不接。
  #   paid-enabled 缺省 false，**prod 配置文件里刻意不出现这个键**（与 mock-login 同一思路）：
  #   真要在生产打开按次收费通道，由部署方显式注入并留下甲方书面同意（合同第二条第 5 款）。
  ocr:
    provider: stub
    paid-enabled: false
  # 文档渲染（DOC-PDF-001 / ADR-0005）：docx → PDF 的转换容器（Gotenberg）。
  #   dev 的后端跑在**宿主**上（qa-up 起的 JVM），所以走宿主环回端口 3010 —— 与 compose 里
  #   gotenberg 服务的 `127.0.0.1:${LQG_GOTENBERG_PORT:-3010}:3000` 对应（只在内网暴露）。
  #   timeout-seconds = 整个转换调用的预算（含排队等待）；超时与连不上都让该份文档**整体 failed**
  #   并把原因写进 t_lqg_doc_file.error_msg（工作台可见、可重试，FLOW:F-DOC-01.step6）。
  doc:
    gotenberg:
      url: ${LQG_GOTENBERG_URL:http://127.0.0.1:3010}
      timeout-seconds: 60
  wx:
    # 真实微信小程序：appid / secret 走环境变量注入，这里缺省为空（本地一律走 mock）。
    # 真机联调时 export LQG_WX_APPID=... LQG_WX_SECRET=...
    miniapp:
      appid: ${LQG_WX_APPID:}
      secret: ${LQG_WX_SECRET:}

