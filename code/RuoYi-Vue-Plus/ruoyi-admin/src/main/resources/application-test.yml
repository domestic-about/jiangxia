---
# ── SYS-STAGING-001：测试环境（songjian.tianda.studio，一台测试机上的 docker compose）──
#
# 与 application-dev.yml 的关系：两边必须**同口径**的三件事写死在各自文件里，不靠命令行参数——
#   1. mybatis-encryptor 的口令 LqgTestAesKey#01（doc/verify/seed/ 的密文按它算的）；
#   2. lqg.auth.mock-login=true（ADR-0008 允许 dev / test；甲方试用就是靠它登进 seed 账号）；
#   3. captcha.enable=false（doc/verify/api.sh 的账号密码登录不带 code / uuid）。
# 与 dev 的差异只有三处，都在下面标了「test 差异」：
#   · 库名 / 宿主端口默认值指向 compose 里的 postgres（lqg_test @ 15432）；
#   · api-decrypt.enabled=false —— 与 dev 的启动参数口径一致，写进文件免得部署时忘；
#   · p6spy 关掉（测试机不做性能分析，日志干净）。
# 真实口令由 compose 的环境变量注入（code/deploy/test/.env，不进 git），本文件不出现任何口令。
#
# ★ 契约：application-prod.yml 里**刻意不出现** mock-login / api-decrypt.enabled=false 这两个键；
#   本文件出现它们正是「test 与 prod 的分界」，AUTH-LOGIN-001 的护栏断言就是查这一点。

# 监控中心配置：测试环境不连 Spring Boot Admin（本项目不起监控服务）
spring.boot.admin.client:
  # 增加客户端开关
  enabled: false

--- # api 接口加解密（test 差异 2）
# doc/verify/api.sh 是裸 curl（不带 encrypt-key 头、不做 RSA/AES），后端开着加解密它一律登录失败。
# dev 是靠启动参数 --api-decrypt.enabled=false 关的；测试环境由本文件关死，部署脚本不用记得传参。
# 网页工作台对应地把 code/plus-ui/.env.test 的 VITE_APP_ENCRYPT 设为 false（同一口径）。
api-decrypt:
  enabled: false

--- # snail-job 配置
# 本项目不用 SnailJob（ADR-0001：定时任务用 Spring @Scheduled）。上游默认 true，这里关掉，
# 免得它去连 17888 的调度服务、报连接错。
# ★ 其余键（port / group / token / server / namespace）必须留着：ruoyi-job 里的 TestBroadcastJob
#   用 @Value("${snail-job.port}") 取值，删了整段会让容器起不来（PlaceholderResolutionException）。
snail-job:
  enabled: false
  # 需要在 SnailJob 后台组管理创建对应名称的组,然后创建任务的时候选择对应的组,才能正确分派任务
  group: "ruoyi_group"
  # SnailJob 接入验证令牌 详见 script/sql/ry_job.sql `sj_group_config` 表
  token: "SJ_cKqBTPzCsWA3VyuCfFoccmuIEGXjr5KT"
  server:
    host: 127.0.0.1
    port: 17888
  # 命名空间UUID 详见 script/sql/ry_job.sql `sj_namespace`表`unique_id`字段
  namespace: ${spring.profiles.active}
  # 随主应用端口漂移
  port: 2${server.port}
  # 客户端ip指定
  host:

--- # 数据源配置（PostgreSQL 16，ADR-0002）
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # 动态数据源文档 https://www.kancloud.cn/tracy5546/dynamic-datasource/content
    dynamic:
      # 性能分析插件(有性能损耗 不建议生产环境使用)——test 差异 3：测试机不做性能分析
      p6spy: false
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      # 严格模式 匹配不到数据源则报错
      strict: true
      datasource:
        # 主库数据源（test 差异 1）：库 lqg_test，宿主端口 15432。
        # 测试机上 5432 是 guzi 项目 guzi-mysql 之外的既有占用面，本项目 compose 只把 postgres
        # 发布到 127.0.0.1:15432（code/deploy/test/docker-compose.yml），所以默认值跟着走。
        # 容器内后端连的是 compose 网络里的 postgres:5432（LQG_DB_HOST/LQG_DB_PORT 由 compose 注入）。
        master:
          type: ${spring.datasource.type}
          driverClassName: org.postgresql.Driver
          url: jdbc:postgresql://${LQG_DB_HOST:127.0.0.1}:${LQG_DB_PORT:15432}/${LQG_DB_NAME:lqg_test}?reWriteBatchedInserts=true&stringtype=unspecified
          username: ${LQG_DB_USER:lqg}
          # 口令只来自环境变量（compose 的 .env，不进 git）；缺省值是本地跑测试时的占位
          password: ${LQG_DB_PASSWORD:lqg_test_pwd}
#        # 从库数据源
#        slave:
#          lazy: true
#          type: ${spring.datasource.type}
#          driverClassName: com.mysql.cj.jdbc.Driver
#          url: jdbc:mysql://localhost:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
#          username:
#          password:
#        oracle:
#          type: ${spring.datasource.type}
#          driverClassName: oracle.jdbc.OracleDriver
#          url: jdbc:oracle:thin:@//localhost:1521/XE
#          username: ROOT
#          password: root
#        postgres:
#          type: ${spring.datasource.type}
#          driverClassName: org.postgresql.Driver
#          url: jdbc:postgresql://localhost:5432/postgres?useUnicode=true&characterEncoding=utf8&useSSL=true&autoReconnect=true&reWriteBatchedInserts=true
#          username: root
#          password: root
#        sqlserver:
#          type: ${spring.datasource.type}
#          driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
#          url: jdbc:sqlserver://localhost:1433;DatabaseName=tempdb;SelectMethod=cursor;encrypt=false;rewriteBatchedStatements=true
#          username: SA
#          password: root
      hikari:
        # 最大连接池数量
        maxPoolSize: 20
        # 最小空闲线程数量
        minIdle: 10
        # 配置获取连接等待超时的时间
        connectionTimeout: 30000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 600000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: 1800000
        # 多久检查一次连接的活性
        keepaliveTime: 30000

--- # redis 单机配置(单机与集群只能开启一个另一个需要注释掉)
spring.data:
  redis:
    # 地址
    host: ${LQG_REDIS_HOST:127.0.0.1}
    # 端口（test 差异 1）：测试机的 redis 发布在宿主 127.0.0.1:16379；容器内后端连 redis:6379
    port: ${LQG_REDIS_PORT:16379}
    # 数据库索引
    database: 0
    # redis 密码：服务端设了 requirepass，客户端必须带同一个口令（由 compose 的 .env 注入）；
    # 缺省值与 code/deploy/test/.env.example 一致。测试机上缺口令后端会直接起不来（ERR AUTH ...）
    password: ${LQG_REDIS_PASSWORD:lqg_test_redis_pwd}
    # 连接超时时间
    timeout: 10s
    # 是否开启ssl
    ssl.enabled: false

# redisson 配置
redisson:
  # redis key前缀
  keyPrefix:
  # 线程池数量
  threads: 4
  # Netty线程池数量
  nettyThreads: 8
  # 单节点配置
  singleServerConfig:
    # 客户端名称 不能用中文
    clientName: RuoYi-Vue-Plus
    # 最小空闲连接数
    connectionMinimumIdleSize: 8
    # 连接池大小
    connectionPoolSize: 32
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 3000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50

--- # mail 邮件发送
mail:
  enabled: false
  host: smtp.163.com
  port: 465
  # 是否需要用户名密码验证
  auth: true
  # 发送方，遵循RFC-822标准
  from: xxx@163.com
  # 用户名（注意：如果使用foxmail邮箱，此处user为qq号）
  user: xxx@163.com
  # 密码（注意，某些邮箱需要为SMTP服务单独设置密码，详情查看相关帮助）
  pass: xxxxxxxxxx
  # 使用 STARTTLS安全连接，STARTTLS是对纯文本通信协议的扩展。
  starttlsEnable: true
  # 使用SSL安全连接
  sslEnable: true
  # SMTP超时时长，单位毫秒，缺省值不超时
  timeout: 0
  # Socket连接超时值，单位毫秒，缺省值不超时
  connectionTimeout: 0

--- # sms 短信 支持 阿里云 腾讯云 云片 等等各式各样的短信服务商
# https://sms4j.com/doc3/ 差异配置文档地址 支持单厂商多配置，可以配置多个同时使用
sms:
  # 配置源类型用于标定配置来源(interface,yaml)
  config-type: yaml
  # 用于标定yml中的配置是否开启短信拦截，接口配置不受此限制
  restricted: true
  # 短信拦截限制单手机号每分钟最大发送，只对开启了拦截的配置有效
  minute-max: 1
  # 短信拦截限制单手机号每日最大发送量，只对开启了拦截的配置有效
  account-max: 30
  # 以下配置来自于 org.dromara.sms4j.provider.config.BaseConfig类中
  blends:
    # 唯一ID 用于发送短信寻找具体配置 随便定义别用中文即可
    # 可以同时存在两个相同厂商 例如: ali1 ali2 两个不同的阿里短信账号 也可用于区分租户
    config1:
      # 框架定义的厂商名称标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: alibaba
      # 有些称为accessKey有些称之为apiKey，也有称为sdkKey或者appId。
      access-key-id: 您的accessKey
      # 称为accessSecret有些称之为apiSecret
      access-key-secret: 您的accessKeySecret
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId
    config2:
      # 厂商标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: tencent
      access-key-id: 您的accessKey
      access-key-secret: 您的accessKeySecret
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId


