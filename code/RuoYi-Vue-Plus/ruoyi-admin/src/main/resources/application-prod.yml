--- # 临时文件存储位置 避免临时文件被系统清理报错
# ★ 生产由 compose 把它挂到数据盘（${LQG_DATA_DIR}/tmp → /ruoyi/server/temp，
#   见 code/deploy/prod/docker-compose.yml 的 backend.volumes）：docx 渲染的中间产物有几十 MB，
#   容器可写层（/var/lib/docker）在系统盘上，落那儿容易把系统盘写满。
spring.servlet.multipart.location: /ruoyi/server/temp

# ── SYS-PROD-001 · 生产环境（一台代购的云服务器上的 docker compose）──────────────────────
#
# ★★ 本文件的**硬契约**（accept 2 最后一段就是 grep 这一点，别在这里「以示安全」地写开关）：
#   SYS-PROD-001 票面点名的**三个危险开关**（分别管：小程序测试登录入口 / 识别按次收费通道 /
#   识别测试桩实现）**在本文件里一个字都不出现**，连注释里也不写它们的键名。
#   ⚠️ 「连注释里也不写」是刻意的：那条 accept 是字面 grep 三个键名，键名哪怕只出现在解释性
#   注释里，断言同样会红。想看这三个键的名字与来由，去读 `application-test.yml` 的页首契约段
#   与 `doc/_adr/0008-*.md`（文件名里带键名的那个 ADR —— 本行刻意不写全名）。
#   理由（ADR-0008 及同批护栏的同一思路）：写一行「关」看起来更安全，实际是把它变成
#   「离被改成 true 只差一次手滑」，而且会让 `application-test.yml` 页首那条
#   「test 出现 / prod 不出现」的分界契约失效。缺省值在代码里已经在安全的那一侧：
#     小程序测试登录       缺省 false（WxIdentityResolver / SysPingController 都读这个缺省）
#     识别 provider        缺省 none（OcrProperties → NoneOcrProvider：提示「请手动填写」）
#     识别按次收费通道     缺省 false
#   真要在生产打开按次收费通道，由部署方在环境变量 / 外部配置里显式注入并留下甲方书面同意
#   （合同第二条第 5 款）——那是一条有签字的变更，不是一行「顺手写上」的配置。
#
# ★ 与 `application-test.yml` 的差别（三处，都是刻意为之）：
#   1. `mybatis-encryptor.password` 从**环境变量**取（生产口令 ≠ 测试的 LqgTestAesKey#01）；
#   2. `captcha.enable` **不关**（test 关它只是为了 doc/verify/api.sh 的裸 curl 能登录；
#      生产该开着——谁都能对着 /auth/login 撞口令是不可接受的）。verify.prod.env 里配的是
#      真实管理员，线上冒烟走工作台登录（带验证码），api.sh 的账号密码登录在生产会被验证码挡住，
#      这是**预期行为**，不是缺陷（见 doc/verify/verify.prod.env.example 的说明）。
#   3. 库 / Redis / Gotenberg 走 compose 内网**服务名**，不是宿主端口。
#
# ★ 其他键（mail / sms / justauth / snail-job 的其余项）保持与上游同构：
#   被显式关掉的开关越多，越容易出现「配置文件与代码缺省不一致」这类只有上线才发现的坑。
#
# ★ 上线安全加固（独立验收 2026-09-23 的 V13 / V14 / V15 / V18，F4）：
#   JWT 签名密钥、接口加解密两把 RSA 密钥、字段加密口令一律**只从环境变量取、没有缺省值**；
#   缺失、等于公开的缺省值、强度不够（JWT < 32 字符 / RSA < 2048 位 / AES 口令不是 16|24|32 位）
#   时由 ruoyi-common-web 的 StartupSafetyGuard 在**连库之前**拒绝启动，并在控制台写明缺哪个变量。
#   生成方法：code/deploy/prod/gen-secrets.sh（一次生成全部，追加进服务器 .env，600 权限）。
#   actuator 只开 health / info、健康详情不外露（nginx 也不转发 /actuator/）。

--- # 监控中心配置
# 本项目不起 Spring Boot Admin（不接第三方 APM，见票面 §3 边界）
spring.boot.admin.client:
  # 增加客户端开关
  enabled: false

--- # snail-job 配置
# 本项目不用 SnailJob（ADR-0001：定时任务用 Spring @Scheduled）。
# ★ 其余键必须留着：ruoyi-job 的 TestBroadcastJob 有 @Value("${snail-job.port}")，删了容器起不来。
snail-job:
  enabled: false
  # 需要在 SnailJob 后台组管理创建对应名称的组,然后创建任务的时候选择对应的组,才能正确分派任务
  group: "ruoyi_group"
  # SnailJob 接入验证令牌 详见 script/sql/ry_job.sql `sj_group_config`表
  token: "SJ_cKqBTPzCsWA3VyuCfFoccmuIEGXjr5KT"
  server:
    host: 127.0.0.1
    port: 17888
  # 命名空间UUID 详见 script/sql/ry_job.sql `sj_namespace`表`unique_id`字段
  namespace: ${spring.profiles.active}
  # 随主应用端口漂移
  port: 2${server.port}
  # 客户端ip指定
  host:

--- # 数据源配置（PostgreSQL 16，ADR-0002：同机 Docker 里的 PG，不买 RDS）
# ★ 口令一律从环境变量取，**不进仓库**；变量名与 code/deploy/prod/docker-compose.yml 一致，
#   由部署侧注入（服务器上的 ${LQG_DATA_DIR}/.env，600）。
# ★ 默认值 host=postgres：正常运行时 compose 会显式给 LQG_DB_HOST=postgres（compose 网络的服务名），
#   这里不写宿主端口 —— 生产的 5432 不在宿主上监听。
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # 动态数据源文档 https://www.kancloud.cn/tracy5546/dynamic-datasource/content
    dynamic:
      # 性能分析插件(有性能损耗 不建议生产环境使用)
      p6spy: false
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      # 严格模式 匹配不到数据源则报错
      strict: true
      datasource:
        # 主库数据源（生产库名固定 lqg，**不含 test** —— doc/verify/reseed.sh 的护栏靠这个字符串
        # 挡住「误对生产灌 seed」）
        master:
          type: ${spring.datasource.type}
          driverClassName: org.postgresql.Driver
          url: jdbc:postgresql://${LQG_DB_HOST:postgres}:${LQG_DB_PORT:5432}/${LQG_DB_NAME:lqg}?reWriteBatchedInserts=true&stringtype=unspecified
          username: ${LQG_DB_USER:lqg}
          password: ${LQG_DB_PASSWORD}
      hikari:
        # 最大连接池数量。★ 与 postgres 的 max_connections=100 对齐着看：
        #   20（后端连接池）+ pg_dump / 运维几条 + 预留，60 以内，留足余量。
        maxPoolSize: 20
        # 最小空闲线程数量（2 核 4G：不要按 4 核模板给 10 以上的常驻连接）
        minIdle: 10
        # 配置获取连接等待超时的时间
        connectionTimeout: 30000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 600000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: 1800000
        # 多久检查一次连接的活性
        keepaliveTime: 30000

--- # redis 单机配置(单机与集群只能开启一个另一个需要注释掉)
# Redis 只放会话 / 锁 / 缓存（生产数据以 PostgreSQL 为准，ADR-0002）；
# compose 里给了 256MB + allkeys-lru 且**关掉快照**，所以这里不做持久化相关的假设。
spring.data:
  redis:
    # 地址：compose 网络的服务名
    host: ${LQG_REDIS_HOST:redis}
    # 端口
    port: ${LQG_REDIS_PORT:6379}
    # 数据库索引
    database: 0
    # redis 密码：从环境变量取，不进仓库
    password: ${LQG_REDIS_PASSWORD}
    # 连接超时时间
    timeout: 10s
    # 是否开启ssl
    ssl.enabled: false

# redisson 配置
redisson:
  # redis key前缀
  keyPrefix:
  # 线程池数量（2 核机器：与 test 同一档；照 4 核模板给 16/32 只会让 GC 更抖）
  threads: 4
  # Netty线程池数量
  nettyThreads: 8
  # 单节点配置
  singleServerConfig:
    # 客户端名称 不能用中文
    clientName: RuoYi-Vue-Plus
    # 最小空闲连接数
    connectionMinimumIdleSize: 8
    # 连接池大小
    connectionPoolSize: 32
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 3000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50

--- # mail 邮件发送
# 本项目不发邮件（通知走飞书机器人，见 code/deploy/prod/healthcheck.sh）。保持上游同构、关着。
mail:
  enabled: false

--- # Sa-Token（V13）
# JWT 签名密钥：若依默认的 abcdefghijklmnopqrstuvwxyz 是公开的，拿它能验签（也能签）真实 token。
# 只从环境变量取、没有缺省值；StartupSafetyGuard 还会拒绝默认值与短于 32 个字符的密钥。
sa-token:
  jwt-secret-key: ${LQG_JWT_SECRET}

--- # 接口加解密（V14）
# 若依那对公开的 512 位 RSA 密钥不许上生产。两对密钥、四个值（gen-secrets.sh 一次生成）：
#   · 请求：前端用 VITE_APP_RSA_PUBLIC_KEY 加密 → 后端用这里的 privateKey 解密（LQG_API_REQUEST_PRIVATE_KEY）
#   · 响应：后端用这里的 publicKey 加密 → 前端用 VITE_APP_RSA_PRIVATE_KEY 解密（LQG_API_RESPONSE_PUBLIC_KEY）
# 前端那两个在**构建工作台时**从环境变量注入（code/plus-ui/.env.production 里不再写死）。
# 开关沿用 application.yml 的缺省（开着），本文件不写它。
api-decrypt:
  publicKey: ${LQG_API_RESPONSE_PUBLIC_KEY}
  privateKey: ${LQG_API_REQUEST_PRIVATE_KEY}

--- # Actuator（V18）
# 上游缺省把全部端点暴露出来、健康详情全开（application.yml），生产只留 health / info，
# 健康详情与组件明细都不外露（{"status":"UP"} 就够部署自检用）。nginx 另外把 /actuator 挡在外面。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never

--- # 数据加密（@EncryptField / SampleFieldCipher）
# ADR-0006：供体姓名、住院号、患者编号三列加密落库。**生产口令 ≠ 测试的 LqgTestAesKey#01。**
# ★ 口令只从环境变量取（compose 注入服务器 .env 里的 LQG_ENCRYPT_PASSWORD，600 权限）；
#   缺失、等于测试口令 LqgTestAesKey#01、长度不是 16 / 24 / 32 → StartupSafetyGuard 拒绝启动（V15）。
# ★ 口令丢了 = 这三列永远读不出来（AES 无后门）→ 上线当天另存一份给 Kevin，记进交接单
#   （doc/ops/部署手册.md §8）。
# ★ enable 保持 true：accept 1 第 2 段要 /lqg/sys/ping 报 encryptEnabled==true。
# ★ algorithm / encode 与 dev / test 同口径（AES + BASE64），否则同一列在新旧环境之间不可读。
mybatis-encryptor:
  enable: true
  algorithm: AES
  encode: BASE64
  password: ${LQG_ENCRYPT_PASSWORD}

--- # 本项目（ruoyi-lqg）自有配置
# ★ 只写「必须显式给」的键。票面点名的那三个危险开关**故意不出现**（键名见页首契约的说明），
#   它们缺省就在安全的那一侧。这个 `lqg:` 块下面只有 doc / wx 两组，不需要再加别的组。
lqg:
  # 文档渲染（DOC-PDF-001 / ADR-0005）：docx → PDF 的转换容器（Gotenberg）。
  #   生产里 backend 与 gotenberg 在同一个 compose 网络 → 走**服务名**（宿主上一个端口都不映射）。
  #   timeout-seconds 与容器的 `--api-timeout=60s` 一致；超时 = 整体 failed + 原因，可重试。
  doc:
    gotenberg:
      url: ${LQG_GOTENBERG_URL:http://gotenberg:3000}
      timeout-seconds: 60
  wx:
    # 真实微信小程序：appid / secret 走环境变量注入（服务器 .env，600），**不进仓库**。
    # 甲方主体 appid 未提供（SYS-RELEASE-001）→ 到位前留空：登录接口会明确报「未配置」，
    # 而不是静默走 mock（prod 下 mock 被 MockLoginGuard 在启动时就拒了，ADR-0008）。
    miniapp:
      appid: ${LQG_WX_APPID:}
      secret: ${LQG_WX_SECRET:}
