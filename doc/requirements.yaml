  - id: REQ-SYS-008
    source: 05-开发合同（已敲定）.md#L77
    module: 数据安全
    text: >
      乙方对本软件的开发及运维过程中接触的所有数据，包括供体个人信息、样本信息与实验结果负有保密义务，不得向任何第三方提供，不得用于本项目以外的用途。
    domain: SYS
    priority: P1
    status: clarify
    clarify: >-
      供体姓名、住院号是否做字段级加密存储？加密后这两列只能精确查询、不能模糊搜索。
    note: >-
      默认口径（AI 定，见 ADR-0006 proposed）：供体姓名、住院号用框架现成的 @EncryptField 加密落库，工作台内部人员看明文，
      按这两列筛选只支持精确匹配；全站 HTTPS；数据库端口不对公网开放；备份文件在 OSS 私有桶；测试环境只用假数据（REQ-SYS-010）；
      拍照识别只接国内服务（REQ-OCR-005）。不做列表打码——内部人员干活要看全名。
