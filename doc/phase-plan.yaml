# 类器官送检与样本管理系统 · 任务计划 phase-plan.yaml（机器可读权威：调度顺序 + 每任务 QA 范围 + 演练剧本）
# ============================================================================
# ticket → 任务的归属写在各 ticket front-matter 的 `phase` 字段；本文件只登记任务本身。
# zhixing 按 order **串行**跑，每个任务末一道干净 QA 门。
#
# 与合同工期的对应（合同第三条：收到首期款起 3 周内出「小程序送检与登录」可试用版，6 周内完成全部开发 + 1 周联调测试）：
#   D1-D5 = 方案第 5 章「小程序送检与登录」功能块 → **D5 结束 = 3 周节点的可试用版**（SYS-STAGING-001 是那个交付点）
#   D6-D7 = 「网页工作台与文档」功能块（样本总表、导出、冻存已提前在 D2-D4 做掉，因为核验与填表离不开它们）
#   D8    = 「联调测试」1 周：生产部署、备份演练、小程序提审、操作说明 + 下方 final_rehearsal
#
# 非开发前置（不是 phase，但卡 phase 进入；写在这里免得丢）：
#   - 首期款 3000 + 首年云资源费 2000 到账（合同第二条）            → 卡 D1 开工
#   - 甲方 10-20 张真实照片（管壁 / 袋子 / 送检单 / 截图）          → 卡 D5 的 OCR-SPIKE-001（其余三张不卡）
#   - Kevin 的测试服务器 + 一个带 HTTPS 的测试域名                   → 卡 D5 的 SYS-STAGING-001
#   - 甲方三份 Word 定稿模板（没有就按现有三份出样张）              → 不卡开发；卡 D7 的 DOC-PROOF-001 能不能一次定稿
#   - ✅ 六个关键页面的设计方案已由 Kevin 选定（2026-09-17，CR-20260917-03：首页 B，其余 A；同日晚 CR-20260917-05 定首页去掉数字、外部三张表、表格页挪进「我的 → 内部管理」且只读、加「我的 → 历史编辑记录」）；2026-09-21 CR-20260921-08 定小程序视觉方向 A「清爽卡片」，规范在 doc/design-options/direction-a/，SYS-MP-001 在 D1 落 token——拆 ticket 的视觉前置已清零
#   - 云服务器 + OSS + 域名购买，域名 ICP 备案（乙方名义，按周计）    → 卡 D8 的 SYS-PROD-001；**D1 开工当周就要启动备案**
#   - 甲方主体注册并认证小程序、给出 appid、把乙方加为开发者          → 卡 D8 的 SYS-RELEASE-001；**同样第一周就要催**
#   - 合同附件二 4 条待确认事项的甲方答复（都有默认口径，见 doc/_oq.md）→ 不卡；答复与默认不同走 CR
# ============================================================================

